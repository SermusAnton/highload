services:

  tarantool:
    image: tarantool/tarantool:3.6.2
    container_name: tarantool
    ports:
      - "3301:3301"
    environment:
      TARANTOOL_USER_NAME: admin
      TARANTOOL_USER_PASSWORD: admin
      # Увеличьте, если данных много. 512MB — это база.
      TARANTOOL_MEMTX_MEMORY: 536870912
    volumes:
      # КРИТИЧНО: Используем именованный volume для скорости (внутри WSL2)
      - tarantool_data:/var/lib/tarantool
      # Скрипт оставляем как есть
      - ./tarantool/init.lua:/opt/tarantool/init.lua
    # Для версии 3.6+ лучше использовать стандартную точку входа,
    # а init.lua подкладывать в /opt/tarantool/
    command: tarantool /opt/tarantool/init.lua
    networks:
      - shared_net
    # Ограничение ресурсов, чтобы Docker не "отъел" всё у Windows
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  db:
    image: postgres:15.14
    container_name: master
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      POSTGRES_HOST_AUTH_METHOD: "${POSTGRES_HOST_AUTH_METHOD:-trust}"
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared_net

  backend:
    build: ./
    container_name: backend
    ports:
      - 8080:8080
    depends_on:
      - tarantool
    networks:
      - shared_net

  jmeter:
    build: /jmeter
    container_name: jmeter
    ports:
      - 9270:9270
    depends_on:
      - backend
    networks:
      - shared_net

  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/config:/etc/prometheus/
      - ./prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    expose:
      - 9090
    ports:
      - 9090:9090
    depends_on:
      - jmeter
    networks:
      - shared_net

  grafana:
    image: grafana/grafana:12.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=myrul.com
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=myadrress@gmail.com
      - GF_SMTP_PASSWORD=mypassword
      - GF_SMTP_FROM_ADDRESS=myaddress@gmail.com
    depends_on:
      - prometheus
    networks:
      - shared_net

networks:
  shared_net:
    external: true
    name: my_shared_network

volumes:
  postgres_data:
  tarantool_data: