---
version: "3"

services:
  db:
    image: postgres:15.14
    container_name: postgres1514
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "logging_collector=on"]
    ports:
      - "5432:5432"

  backend:
    build: ./
    ports:
      - "8080:8080"
    network_mode: host
    depends_on:
      - db

volumes:
  postgres-data:
    external: true