services:

  db:
    image: postgres:15.14
    container_name: master
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      POSTGRES_HOST_AUTH_METHOD: "${POSTGRES_HOST_AUTH_METHOD:-trust}"
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared_net

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-stomp
    ports:
      # AMQP (стандартный протокол)
      - 5672:5672
      # Management UI (админка)
      - 15672:15672
      # Web STOMP (WebSocket)
      - 15674:15674
      #STOMP (для Spring Broker Relay)
      - 61613:61613
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      # Включаем плагин Web STOMP при запуске
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_opts [{plugins, [rabbitmq_web_stomp]}]"
      RABBITMQ_ENABLED_PLUGINS: "rabbitmq_stomp,rabbitmq_web_stomp,rabbitmq_management"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # Создаем файл со списком плагинов прямо при запуске
    entrypoint: >
      sh -c "echo '[rabbitmq_stomp,rabbitmq_web_stomp,rabbitmq_management].' > /etc/rabbitmq/enabled_plugins && exec rabbitmq-server"
    networks:
      - shared_net

  backend:
    build: ./
    container_name: backend
    ports:
      - 8080:8080
    networks:
      - shared_net

  jmeter:
    build: /jmeter
    container_name: jmeter
    ports:
      - 9270:9270
    depends_on:
      - backend
    networks:
      - shared_net

  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/config:/etc/prometheus/
      - ./prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    expose:
      - 9090
    ports:
      - 9090:9090
    depends_on:
      - jmeter
    networks:
      - shared_net

  grafana:
    image: grafana/grafana:12.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=myrul.com
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=myadrress@gmail.com
      - GF_SMTP_PASSWORD=mypassword
      - GF_SMTP_FROM_ADDRESS=myaddress@gmail.com
    depends_on:
      - prometheus
    networks:
      - shared_net

networks:
  shared_net:
    external: true
    name: my_shared_network

volumes:
  postgres_data: