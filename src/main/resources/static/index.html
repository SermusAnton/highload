<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>STOMP Test Client</title>
  <!-- ИСПРАВЛЕНО: Полная ссылка на библиотеку StompJs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; background: #f9f9f9; margin-top: 10px; }
    .controls { margin-top: 20px; padding: 15px; background: #eee; border-radius: 5px; }
    input { padding: 8px; width: 350px; }
    button { padding: 8px 15px; cursor: pointer; }
    #status { font-weight: bold; margin-bottom: 10px; }
  </style>
</head>
<body>
<h2>WebSocket STOMP Test</h2>
<div id="status">Статус: Подключение...</div>

<div class="controls">
  <input type="text" id="topicInput" placeholder="Например: /topic/test" value="/topic/user.88313d7d-93b3-48f3-a731-9e1f4e21d7c8.posted">
  <button onclick="subscribe()">Подписаться</button>
</div>

<h3>Лог сообщений:</h3>
<div id="messages"></div>

<script>
  // Для старой библиотеки (stomp.js) синтаксис такой:
  var socket = new WebSocket('ws://localhost:8080/ws');
  var client = Stomp.over(socket);

  client.connect({}, function (frame) {
    document.getElementById('status').innerText = 'Статус: ПОДКЛЮЧЕНО';
    document.getElementById('status').style.color = 'green';
    console.log('Connected: ' + frame);
  }, function (error) {
    document.getElementById('status').innerText = 'Ошибка: ' + error;
    document.getElementById('status').style.color = 'red';
  });

  function subscribe() {
    var topic = document.getElementById('topicInput').value;
    client.subscribe(topic, function (message) {
      var msgElement = document.createElement('div');
      msgElement.innerText = "Получено: " + message.body;
      document.getElementById('messages').appendChild(msgElement);
    });
    console.log('Subscribed to: ' + topic);
  }
</script>
</body>
</html>
